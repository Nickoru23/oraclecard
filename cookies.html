<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Witch Atelier</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<style>
  .doc{max-width:74ch}
  .doc h2{font-family:var(--serif);color:var(--gold);font-size:1.3rem;margin:2.2em 0 .4em}
  .doc h2:first-of-type{margin-top:1.2em}
  .doc p{color:var(--bone-dim)}
  .doc a{text-decoration:underline}
  .stamp{font-size:.82rem;color:var(--muted);margin-top:3em;padding-top:1.4em;
    border-top:1px solid var(--line)}
  footer.site nav{display:flex;gap:18px;flex-wrap:wrap}
</style>
</head>
<body>

<header class="site"><div class="wrap nav">
  <a class="brand" href="/"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.1 1.8c-.6 0-1.2.5-1.6 1.4C10.4 6 9.2 9.4 8.4 12.5h8.4c-.5-3.2-1.3-6.8-2-9.3-.3-.9-.9-1.4-1.7-1.4Z" fill="#241F18"/><path d="M2.6 14.6c0-1.2 2.4-2.1 5.6-2.3h8.2c3.3.2 5.6 1.1 5.6 2.3 0 1.4-3.2 2.2-7.4 2.4h-4.6c-4.2-.2-7.4-1-7.4-2.4Z" fill="#241F18"/><path d="M8.2 13.4h8.8v1.5H8.1z" fill="#8C5E20"/><path d="M19.9 2.2l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z" fill="#8C5E20"/></svg> The Witch Atelier</a>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false"
            aria-controls="site-menu" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  <nav id="site-menu">
    <a href="/galleta.html" data-t="nav_cookie"></a>
    <a href="/horoscopo.html" data-t="nav_horoscopo"></a>
    <a href="/consulta.html" data-t="nav_consulta"></a>
    <a href="/lectura.html" data-t="nav_reading"></a>
    <a href="/#baraja" class="hide-sm" data-t="nav_deck"></a>
    <span class="lang">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </span>
  </nav>
</div></header>

<section><div class="wrap">
  <h1 id="doc-title" style="font-size:clamp(2rem,5vw,2.8rem)"></h1>
  <div class="doc" id="doc-body"></div>
  <p class="stamp" id="doc-stamp"></p>
</div></section>

<footer class="site"><div class="wrap">
  <span>&copy; <span id="yr"></span> The Witch Atelier</span>
  <nav>
    <a href="/aviso-legal.html" data-t="footer_legal"></a>
    <a href="/privacidad.html" data-t="footer_privacy"></a>
    <a href="/cookies.html">Cookies</a>
    <a href="/creditos.html" data-t="credits_nav"></a>
  </nav>
</div></footer>

<script src="/js/i18n.js"></script>
<script src="/js/legal.js"></script>
<script src="/js/notice.js"></script>
<script>
(function () {
  var KEY = "cookies", SLUG = "cookies_h";
  var L = window.LEGAL;
  function fill(t) {
    return t.replace(/\{OPERATOR\}/g, L.OPERATOR).replace(/\{ADDRESS\}/g, L.ADDRESS)
            .replace(/\{EMAIL\}/g, L.EMAIL)
            .replace(/\{SITE\}/g, L.SITE);
  }
  function paint() {
    var lang = document.documentElement.dataset.lang;
    if (lang !== 'en' && lang !== 'de') lang = 'es';
    var S = L[lang];
    document.getElementById('doc-title').textContent = S[SLUG];
    document.getElementById('doc-body').innerHTML = S[KEY]
      .map(function (s) { return '<h2>' + s[0] + '</h2><p>' + fill(s[1]) + '</p>'; }).join('');
    document.getElementById('doc-stamp').textContent =
      ({ en: 'Last updated: ', de: 'Zuletzt aktualisiert: ', es: 'Última actualización: ' }[lang]) + L.UPDATED;
    document.title = S[SLUG] + ' \u00b7 The Witch Atelier';
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = window.T[lang][el.dataset.t];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    document.documentElement.lang = lang;
  }
  function setLang(l) {
    document.documentElement.dataset.lang = l;
    try { localStorage.setItem('umbral.lang', l); } catch (e) {}
    paint();
  }
  var start = null;
  try { start = localStorage.getItem('umbral.lang'); } catch (e) {}
  if (start !== 'en' && start !== 'es' && start !== 'de') {
    var nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
    start = nav === 'en' ? 'en' : nav === 'de' ? 'de' : 'es';
  }
  document.documentElement.dataset.lang = start;
  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setLang(b.dataset.lang);
  });
  document.getElementById('yr').textContent = new Date().getFullYear();
  paint();
})();
</script>
</body>
</html>
