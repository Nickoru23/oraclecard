<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créditos · The Witch Atelier</title>
<meta name="description" content="Las fotografías de la baraja del taller y sus autores en Unsplash.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<style>
  .credits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:34px}
  .credit{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .credit a{font-size:.95rem}
  .credit span{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
</style>
</head>
<body>

<header class="site"><div class="wrap nav">
  <a class="brand" href="/">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.1 1.8c-.6 0-1.2.5-1.6 1.4C10.4 6 9.2 9.4 8.4 12.5h8.4c-.5-3.2-1.3-6.8-2-9.3-.3-.9-.9-1.4-1.7-1.4Z" fill="#241F18"/><path d="M2.6 14.6c0-1.2 2.4-2.1 5.6-2.3h8.2c3.3.2 5.6 1.1 5.6 2.3 0 1.4-3.2 2.2-7.4 2.4h-4.6c-4.2-.2-7.4-1-7.4-2.4Z" fill="#241F18"/><path d="M8.2 13.4h8.8v1.5H8.1z" fill="#8C5E20"/><path d="M19.9 2.2l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z" fill="#8C5E20"/></svg>
    The Witch Atelier</a>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false"
            aria-controls="site-menu" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  <nav id="site-menu">
    <a href="/galleta.html" data-t="nav_cookie"></a>
    <a href="/horoscopo.html" data-t="nav_horoscopo"></a>
    <a href="/consulta.html" data-t="nav_consulta"></a>
    <a href="/lectura.html" data-t="nav_reading"></a>
    <a href="/#baraja" class="hide-sm" data-t="nav_deck"></a>
    <span class="lang">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="de" aria-pressed="false">DE</button>
    </span>
  </nav>
</div></header>

<section><div class="wrap">
  <h1 style="font-size:clamp(2rem,5vw,3rem)" data-t="credits_h"></h1>
  <p class="lede" data-t="credits_lede"></p>
  <div class="credits" id="credits"></div>
</div></section>

<footer class="site"><div class="wrap">
  <span class="small" style="flex:1 1 300px;max-width:52ch" data-t="disclaimer"></span>
  <nav>
    <a href="/aviso-legal.html" data-t="footer_legal"></a>
    <a href="/privacidad.html" data-t="footer_privacy"></a>
    <a href="/cookies.html">Cookies</a>
    <a href="/creditos.html" data-t="credits_nav"></a>
  </nav>
</div></footer>

<script src="/js/deck.js"></script>
<script src="/js/photos.js"></script>
<script src="/js/art.js"></script>
<script src="/js/art2.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ornament.js"></script>
<script>
  document.addEventListener('artready', () => {
    document.getElementById('credits').innerHTML = (window.PHOTO_CREDITS || [])
      .map(c => `<div class="credit">
          <a href="${c.u}" target="_blank" rel="noopener">${c.by}</a>
          <span>${c.a}</span>
          <a class="small" href="${c.h}" target="_blank" rel="noopener">Unsplash →</a>
        </div>`).join('');
  });
</script>
<script src="/js/notice.js"></script>
</body>
</html>
