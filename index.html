<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Witch Atelier · Tarot gratis y lecturas personalizadas</title>
<meta name="description" content="Un taller de tarot. Tiradas gratis al instante y lecturas escritas sobre tu pregunta concreta. Baraja propia de 78 cartas.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<style>
  #deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
  .deck-cell{background:none;border:0;padding:0;cursor:pointer;border-radius:3px;overflow:hidden;
    line-height:0;transition:transform .18s ease,box-shadow .18s ease;box-shadow:0 6px 18px -8px rgba(40,32,20,.28)}
  .deck-cell:hover{transform:translateY(-4px);box-shadow:0 14px 30px -10px rgba(40,32,20,.34)}
  .deck-cell svg{width:100%;height:auto;display:block}
  dialog{background:var(--ink-2);color:var(--bone);border:1px solid var(--line-2);border-radius:4px;
    padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(5,4,10,.82);backdrop-filter:blur(6px)}
  .modal-in{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:26px}
  .modal-in svg{width:100%;height:auto;border-radius:3px;display:block}
  .modal-in h4{font-family:var(--serif);color:var(--gold);margin:1.1em 0 .2em;font-size:1.05rem}
  .modal-in p{color:var(--bone-dim);font-size:.94rem}
  .modal-close{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);
    font-size:1.5rem;cursor:pointer;line-height:1}
  @media(max-width:620px){.modal-in{grid-template-columns:1fr;padding:20px}
    .modal-in>div:first-child{max-width:180px;margin:0 auto}}
  .hero-fan{display:flex;justify-content:center;margin-top:46px}
  .hero-fan .f{width:126px;margin:0 -22px;border-radius:3px;overflow:hidden;line-height:0;
    box-shadow:0 6px 14px rgba(0,0,0,.4),0 30px 56px -22px rgba(0,0,0,.8);border:1px solid rgba(38,32,24,.5)}
  .hero-fan .f svg{width:100%;height:auto;display:block}
  .hero-fan .f:nth-child(1){transform:rotate(-11deg) translateY(12px);z-index:1}
  .hero-fan .f:nth-child(2){z-index:2}.hero-fan .f:nth-child(3){z-index:3}
  .hero-fan .f:nth-child(4){z-index:2}.hero-fan .f:nth-child(5){z-index:1}
  .hero-fan .f:nth-child(2){transform:rotate(-5deg) translateY(2px)}
  .hero-fan .f:nth-child(4){transform:rotate(5deg) translateY(2px)}
  .hero-fan .f:nth-child(5){transform:rotate(11deg) translateY(12px)}
  @media(max-width:520px){.hero-fan .f{width:88px;margin:0 -16px}}
</style>
<style>
  .cta-panel{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center}
  .cta-panel .btn{white-space:nowrap}
  @media(max-width:760px){
    .cta-panel{grid-template-columns:1fr;gap:20px}
    .cta-panel .btn{width:100%;text-align:center}
  }
</style>
<style>
  .split-h{margin-bottom:26px;text-align:center}
  .split-h h2{margin:0 0 .25em}
  .split-h .lede{margin:0 auto;max-width:54ch}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .item{display:block;border:1px solid var(--line);border-radius:var(--r);padding:24px;
        background:var(--ink-2);transition:.18s;text-decoration:none}
  .item:hover{border-color:var(--gold);background:var(--veil);text-decoration:none;
              transform:translateY(-2px);box-shadow:0 14px 26px -18px rgba(0,0,0,.45)}
  .item{transition:border-color .18s ease,background .18s ease,transform .18s ease,box-shadow .18s ease}
  .item h3{margin:10px 0 8px;color:var(--bone);font-size:1.2rem}
  .item p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}
  .item .go{display:inline-block;margin-top:14px;color:var(--gold);font-size:.86rem}
  .item .go::after{content:' \2192'}
  .tag{display:inline-block;border:1px solid var(--line-2);border-radius:2px;padding:3px 11px;
       font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .tag-gold{border-color:var(--gold);color:var(--gold)}
  .item-paid{display:block}
  @media(max-width:820px){.menu-grid{grid-template-columns:1fr;gap:12px}}
</style>
</head>
<body>

<header class="site"><div class="wrap nav">
  <a class="brand" href="/">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.1 1.8c-.6 0-1.2.5-1.6 1.4C10.4 6 9.2 9.4 8.4 12.5h8.4c-.5-3.2-1.3-6.8-2-9.3-.3-.9-.9-1.4-1.7-1.4Z" fill="#241F18"/><path d="M2.6 14.6c0-1.2 2.4-2.1 5.6-2.3h8.2c3.3.2 5.6 1.1 5.6 2.3 0 1.4-3.2 2.2-7.4 2.4h-4.6c-4.2-.2-7.4-1-7.4-2.4Z" fill="#241F18"/><path d="M8.2 13.4h8.8v1.5H8.1z" fill="#8C5E20"/><path d="M19.9 2.2l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z" fill="#8C5E20"/></svg>
    The Witch Atelier</a>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false"
            aria-controls="site-menu" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  <nav id="site-menu">
    <a href="/galleta.html" data-t="nav_cookie"></a>
    <a href="/horoscopo.html" data-t="nav_horoscopo"></a>
    <a href="/consulta.html" data-t="nav_consulta"></a>
    <a href="/lectura.html" data-t="nav_reading"></a>
    <a href="#baraja" class="hide-sm" data-t="nav_deck"></a>
    <span class="lang">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="de" aria-pressed="false">DE</button>
    </span>
  </nav>
</div></header>

<section class="hero"><div class="wrap">
  <p class="eyebrow" data-t="hero_eyebrow"></p>
  <h1 data-t="hero_h1" data-thtml="1"></h1>
  <p class="lede" data-t="hero_lede"></p>
  <div class="hero-cta">
    <a class="btn btn-gold btn-lg" href="#gratis" data-t="cta_free"></a>
    <a class="btn btn-ghost btn-lg" href="#pago" data-t="cta_paid"></a>
  </div>
  <div class="hero-fan" id="fan" aria-hidden="true"></div>
</div></section>


<section id="gratis"><div class="wrap">
  <div class="split-h">
    <h2 data-banner data-t="free_h2"></h2>
    <p class="lede" data-t="free_sub"></p>
  </div>
  <div class="menu-grid">
    <a class="item plate" href="/galleta.html">
      <span class="tag" data-t="it_free_tag"></span>
      <h3 data-t="it_cookie_t"></h3>
      <p data-t="it_cookie_d"></p>
      <span class="go" data-t="it_open"></span>
    </a>
    <a class="item plate" href="/horoscopo.html">
      <span class="tag" data-t="it_free_tag"></span>
      <h3 data-t="it_hor_t"></h3>
      <p data-t="it_hor_d"></p>
      <span class="go" data-t="it_open"></span>
    </a>
    <a class="item plate" href="/consulta.html">
      <span class="tag" data-t="it_free_tag"></span>
      <h3 data-t="it_ask_t"></h3>
      <p data-t="it_ask_d"></p>
      <span class="go" data-t="it_open"></span>
    </a>
    <a class="item plate" href="#tiradas">
      <span class="tag" data-t="it_free_tag"></span>
      <h3 data-t="it_deck_t"></h3>
      <p data-t="it_deck_d"></p>
      <span class="go" data-t="it_open"></span>
    </a>
  </div>
</div></section>

<section id="ritual"><div class="wrap">
  <div class="split-h">
    <h2 data-banner data-t="ritual_h"></h2>
    <p class="lede" data-t="ritual_sub"></p>
  </div>
  <div id="ritual-ledger"></div>
</div></section>

<section id="pago"><div class="wrap">
  <div class="split-h">
    <h2 data-banner data-t="paid_h2"></h2>
    <p class="lede" data-t="paid_sub"></p>
  </div>
  <a class="item item-paid plate" href="/lectura.html">
    <span class="tag tag-gold">9 € / 19 € / 29 €</span>
    <h3 data-t="it_full_t"></h3>
    <p data-t="it_full_d"></p>
    <span class="go" data-t="cta_paid"></span>
  </a>
</div></section>

<hr class="rule">

<section id="tiradas"><div class="wrap">
  <div class="center" style="margin-bottom:30px">
    <h2 data-banner data-t="spreads_h2"></h2>
    <p class="lede" style="margin:0 auto" data-t="spreads_lede"></p>
  </div>
  <div class="tabs" id="sp-tabs" role="tablist">
    <button class="tab" role="tab" data-sp="daily" aria-selected="true" data-t="sp_daily"></button>
    <button class="tab" role="tab" data-sp="three" aria-selected="false" data-t="sp_three"></button>
    <button class="tab" role="tab" data-sp="yesno" aria-selected="false" data-t="sp_yesno"></button>
    <button class="tab" role="tab" data-sp="love"  aria-selected="false" data-t="sp_love"></button>
  </div>
  <p class="center muted small" id="sp-desc" style="margin-top:-18px"></p>
  <div class="center" style="margin:20px 0 34px">
    <button class="btn btn-gold" id="sp-draw" data-t="draw"></button>
  </div>
  <div id="sp-out"></div>
</div></section>

<hr class="rule">

<section class="tight"><div class="wrap">
  <div class="panel cta-panel">
    <div>
      <p class="eyebrow" data-t="paid_eyebrow"></p>
      <h2 style="margin-bottom:.3em" data-t="paid_h1"></h2>
      <p class="lede" data-t="paid_lede"></p>
    </div>
    <a class="btn btn-gold btn-lg" href="/lectura.html" data-t="cta_paid"></a>
  </div>
</div></section>

<hr class="rule">

<section id="baraja"><div class="wrap">
  <div class="center" style="margin-bottom:26px">
    <h2 data-banner data-t="deck_h2"></h2>
    <p class="lede" style="margin:0 auto" data-t="deck_lede"></p>
  </div>
  <div class="tabs" id="deck-filters">
    <button class="tab" data-filter="all" aria-selected="true" data-t="filt_all"></button>
    <button class="tab" data-filter="major" aria-selected="false" data-t="filt_major"></button>
  </div>
  <div id="deck-grid"></div>
</div></section>

<dialog id="card-modal">
  <button class="modal-close" onclick="this.closest('dialog').close()" aria-label="×">×</button>
  <div class="modal-in"><div data-modal-art></div><div data-modal-body></div></div>
</dialog>

<footer class="site"><div class="wrap">
  <span>© <span id="yr"></span> The Witch Atelier</span>
  <span class="small" style="flex:1 1 300px;max-width:52ch" data-t="disclaimer"></span>
  <nav>
    <a href="/aviso-legal.html" data-t="footer_legal"></a>
    <a href="/privacidad.html" data-t="footer_privacy"></a>
    <a href="/cookies.html">Cookies</a>
    <a href="/creditos.html" data-t="credits_nav"></a>
  </nav>
</div></footer>

<script src="/js/deck.js"></script>
<script src="/js/art-marseille.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ritual.js"></script>
<script src="/js/ledger.js"></script>
<script src="/js/ornament.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (function fan(){
    const ids=['m17','m01','m19','m10','m21'];
    document.getElementById('fan').innerHTML = ids
      .map(id=>`<div class="f">${window.cardSVG(window.DECK.find(c=>c.id===id), window.getLang())}</div>`).join('');
    document.addEventListener('langchange', ()=>{
      document.getElementById('fan').innerHTML = ids
        .map(id=>`<div class="f">${window.cardSVG(window.DECK.find(c=>c.id===id), window.getLang())}</div>`).join('');
    });
  })();
</script>
<script src="/js/notice.js"></script>
</body>
</html>
