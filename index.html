<style>
  #deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
  /* the card's own proportions, so a cell waiting for its drawing takes exactly
     the room the drawing will take and the page never resettles under anyone */
  .deck-cell{background:none;border:0;padding:0;cursor:grab;border-radius:var(--r-card);
    aspect-ratio:300/510;
    line-height:0;transition:transform .2s ease,box-shadow .2s ease;
    box-shadow:0 10px 26px -12px rgba(0,0,0,.9),0 0 20px -8px rgba(214,201,168,.5)}
  /* no transform here: card3d.js owns the transform on a card, and a rule that
     sets it whole would throw the rotation away. The lift is its scale. */
  .deck-cell:hover{box-shadow:0 18px 36px -12px rgba(0,0,0,.9),0 0 34px -6px rgba(214,201,168,.85)}
  .deck-cell svg{width:100%;height:auto;display:block}
  /* This was mixed by hand rather than taken from a token, so it kept the old
     violet after everything around it went black. A dialog is a plate lifted
     off the page, so it is the raised pane, and the ground behind it is the
     ground. */
  dialog{background:rgba(17,17,20,.95);backdrop-filter:blur(20px);color:var(--bone);
    border:1px solid var(--line-2);border-radius:var(--r);
    padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:var(--shadow-lift)}
  dialog::backdrop{background:rgba(4,4,5,.88);backdrop-filter:blur(8px)}
  .modal-in{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:26px}
  .modal-in svg{width:100%;height:auto;border-radius:var(--r-card);display:block}
  .modal-in h4{font-family:var(--serif);color:var(--cyan);margin:1.2em 0 .25em;font-size:1.08rem}
  .modal-in p{color:var(--bone-dim);font-size:.94rem}
  .modal-close{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);
    font-size:1.5rem;cursor:pointer;line-height:1}
  @media(max-width:620px){.modal-in{grid-template-columns:1fr;padding:20px}
    .modal-in>div:first-child{max-width:180px;margin:0 auto}}
  .hero-fan{display:flex;justify-content:center;margin-top:46px}
  .hero-fan .f{width:126px;margin:0 -22px;border-radius:var(--r-card);line-height:0;
    box-shadow:0 22px 48px -18px rgba(0,0,0,.92),0 0 40px -10px rgba(214,201,168,.6);
    border:1px solid var(--line-2)}
  .hero-fan .f svg{width:100%;height:auto;display:block}
  .hero-fan .f:nth-child(1){--fan:-11deg;--lift:12px;z-index:1}
  .hero-fan .f:nth-child(2){--fan:-5deg;--lift:2px;z-index:2}
  .hero-fan .f:nth-child(3){--fan:0deg;--lift:0px;z-index:3}
  .hero-fan .f:nth-child(4){--fan:5deg;--lift:2px;z-index:2}
  .hero-fan .f:nth-child(5){--fan:11deg;--lift:12px;z-index:1}
  .hero-fan .f{
    transform:perspective(1000px) rotate(var(--fan,0deg)) translateY(var(--lift,0px))
              rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));
    transition:transform .35s cubic-bezier(.2,.9,.25,1)}
  .hero-fan .f.is-held{transition:none}
  @media(max-width:520px){.hero-fan .f{width:88px;margin:0 -16px}}
</style>
<style>
  /* The panel that sells the reading is now built like one of the cards: a
     double frame with a lozenge at each corner, which is the grammar the 78
     are drawn in. Same plate underneath, so it is the deck's treatment and
     not a second idea. */
  .cta-panel{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;
             position:relative;padding:38px 40px}
  .cta-panel::before{
    content:'';position:absolute;inset:9px;pointer-events:none;border-radius:2px;
    border:1px solid rgba(214,201,168,.30)
  }
  .cta-panel::after{
    content:'';position:absolute;inset:9px;pointer-events:none;
    background-image:
      radial-gradient(circle,var(--star) 2.4px,transparent 2.6px),
      radial-gradient(circle,var(--star) 2.4px,transparent 2.6px),
      radial-gradient(circle,var(--star) 2.4px,transparent 2.6px),
      radial-gradient(circle,var(--star) 2.4px,transparent 2.6px);
    background-size:7px 7px;background-repeat:no-repeat;
    background-position:top left,top right,bottom left,bottom right;
    opacity:.85
  }
  .cta-panel > *{position:relative;z-index:1}
  .cta-panel .btn{white-space:nowrap}
  @media(max-width:760px){
    .cta-panel{grid-template-columns:1fr;gap:20px;padding:30px 26px}
    .cta-panel .btn{width:100%;text-align:center}
  }
</style>
<style>
  .split-h{margin-bottom:26px;text-align:center}
  .split-h h2{margin:0 0 .25em}
  .split-h .lede{margin:0 auto;max-width:54ch}
  /* An index, not four identical cards. Four slabs with the same border, the
     same radius and the same glow are what a page looks like when nothing has
     been decided about it. These are entries in a list, ruled apart, with the
     tag doing the work the border was doing. */
  .menu-grid{display:block;border-top:1px solid var(--line)}
  .item{
    display:grid;grid-template-columns:1fr auto;align-items:baseline;
    column-gap:28px;row-gap:4px;
    padding:26px 4px 24px;border-bottom:1px solid var(--line);
    text-decoration:none;position:relative;
    transition:padding-left .22s cubic-bezier(.2,.9,.25,1),border-color .22s ease
  }
  /* the rule under an entry lights along its length as you reach it */
  .item::after{
    content:"";position:absolute;left:0;bottom:-1px;height:1px;width:0;
    background:linear-gradient(90deg,var(--star),transparent);
    transition:width .4s cubic-bezier(.2,.9,.25,1)
  }
  .item:hover,.item:focus-visible{text-decoration:none;padding-left:18px}
  .item:hover::after,.item:focus-visible::after{width:100%}
  .item .tag{grid-column:1;grid-row:1}
  .item h3{grid-column:1;grid-row:2;margin:0;color:var(--bone)}
  .item:hover h3{color:var(--star-hi)}
  .item p{grid-column:1;grid-row:3;margin:5px 0 0;color:var(--muted);font-size:.92rem;
          line-height:1.6;max-width:56ch}
  /* The third of three, and the quietest: the whole row is the link, so this
     only has to point. It was set in --muted, which is the colour of text that
     is not a control at all, and at .62rem it disappeared. */
  .item .go{
    grid-column:2;grid-row:2;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--star);font-weight:600;white-space:nowrap;
    transition:color .18s ease
  }
  .item .go::after{content:' \2192';display:inline-block;transition:transform .22s ease}
  .item:hover .go{color:var(--star-hi)}
  .item:hover .go::after{transform:translateX(5px)}
  .tag{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--star);font-weight:600}
  @media(max-width:640px){
    .item{grid-template-columns:1fr}
    .item .go{grid-column:1;grid-row:4;margin-top:12px}
  }
</style>
</head>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (function fan(){
    const ids=['m17','m01','m19','m10','m21'];
    document.getElementById('fan').innerHTML = ids
      .map(id=>`<div class="f">${window.cardObject(window.DECK.find(c=>c.id===id), window.getLang(), 'sm')}</div>`).join('');
    document.addEventListener('langchange', ()=>{
      document.getElementById('fan').innerHTML = ids
        .map(id=>`<div class="f">${window.cardObject(window.DECK.find(c=>c.id===id), window.getLang(), 'sm')}</div>`).join('');
    });
  })();
</script>
