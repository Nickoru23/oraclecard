<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galleta de la fortuna · The Witch Atelier</title>
<meta name="description" content="Una galleta de la fortuna al día. Gratis, sin registro, y una carta dentro.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<style>
  .cookie-stage{display:grid;place-items:center;padding:26px 0 10px;min-height:270px}
  .cookie-btn{background:none;border:0;padding:0;cursor:pointer;width:min(320px,80vw);
              display:block;filter:drop-shadow(0 14px 18px rgba(40,32,20,.22))}
  .cookie-btn svg{width:100%;height:auto;display:block;overflow:visible}
  .cookie-btn:disabled{cursor:default}
  .half{transition:transform .75s cubic-bezier(.22,1,.36,1)}
  .is-open .half-l{transform:translate(-34px,10px) rotate(-16deg)}
  .is-open .half-r{transform:translate(34px,10px) rotate(16deg)}
  .slip{opacity:0;transform:translateY(6px) scaleY(.4);transform-origin:50% 100%;
        transition:opacity .5s ease .35s,transform .6s cubic-bezier(.22,1,.36,1) .3s}
  .is-open .slip{opacity:1;transform:none}
  .cookie-btn:not(:disabled):hover svg{animation:wiggle .5s ease}
  @keyframes wiggle{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}

  .tap{text-align:center;color:var(--muted);font-size:.9rem;margin:2px 0 0}
  .fortune{max-width:30ch;margin:26px auto 0;text-align:center;font-family:var(--serif,Georgia,serif);
           font-size:clamp(1.25rem,4.2vw,1.7rem);line-height:1.45;color:var(--bone);
           opacity:0;transform:translateY(10px);transition:opacity .6s ease .55s,transform .6s ease .55s}
  .fortune.in{opacity:1;transform:none}
  .cookie-card{max-width:340px;margin:30px auto 0;text-align:center;
               opacity:0;transition:opacity .6s ease .9s}
  .cookie-card.in{opacity:1}
  .cookie-card .art{width:150px;margin:12px auto 0}
  .cookie-card .art svg{width:100%;height:auto;display:block;border-radius:8px}
  .cookie-card h3{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
  .cookie-card .nm{color:var(--bone);margin:10px 0 0}
  .cookie-card p.mean{color:var(--muted);font-size:.92rem;line-height:1.6;margin:8px 0 0}
  .streak{display:flex;justify-content:center;gap:26px;margin:34px 0 0;padding-top:22px;
          border-top:1px solid var(--line);flex-wrap:wrap}
  .streak div{text-align:center;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .streak b{display:block;font-size:1.6rem;letter-spacing:0;text-transform:none;color:var(--gold);font-weight:400;margin-top:4px}
  .after{text-align:center;margin:28px 0 0}
  .after .btn{margin:6px 5px 0}
  .tomorrow{text-align:center;color:var(--muted);font-size:.88rem;margin:22px 0 0}
</style>
</head>

    The Witch Atelier</a>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false"

      <span></span><span></span><span></span>

  <nav id="site-menu">

<section><div class="wrap">

<script>
window.initCookie = function () {
  const C = window.COOKIE, T = window.T;
  const lang = () => window.getLang();
  const btn = document.getElementById('cookie');
  const stage = btn.parentElement;
  const fortuneEl = document.getElementById('fortune');
  const cardBox = document.getElementById('ck-card');
  const after = document.getElementById('after');
  const streak = document.getElementById('streak');
  const tap = document.getElementById('tap');
  if (!btn) return;

  let opened = false;

  function paintCard(c) {
    const L = T[lang()];
    document.getElementById('ck-card-h').textContent = c.label;
    document.getElementById('ck-art').innerHTML = window.cardSVG(c.card, lang());
    document.getElementById('ck-name').textContent = c.card.name[lang()];
    document.getElementById('ck-mean').textContent = c.card.up[lang()];
    document.getElementById('tomorrow').textContent = L.ck_tomorrow;
  }

  function paintStreak() {
    const s = C.state();
    document.getElementById('s-streak').textContent = s.streak || 0;
    document.getElementById('s-total').textContent = s.total || 0;
    streak.hidden = !(s.total > 0);
  }

  /* the whole point is that it only opens once a day: reopening the page after
     cracking it shows the same fortune already out of its shell */
  function reveal(instant) {
    const c = C.todaysCookie(lang());
    opened = true;
    btn.disabled = true;
    stage.classList.add('is-open');
    fortuneEl.textContent = c.fortune;
    paintCard(c);
    cardBox.hidden = false;
    after.hidden = false;
    tap.textContent = '';
    if (instant) {
      fortuneEl.style.transition = 'none';
      cardBox.style.transition = 'none';
    }
    requestAnimationFrame(() => {
      fortuneEl.classList.add('in');
      cardBox.classList.add('in');
    });
    paintStreak();
  }

  btn.addEventListener('click', () => {
    if (opened) return;
    C.markOpened();
    reveal(false);
  });

  document.getElementById('share').addEventListener('click', async () => {
    const c = C.todaysCookie(lang());
    const text = `${c.fortune}\n\n${c.label}: ${c.card.name[lang()]}\nthewitchatelier.com`;
    const L = T[lang()];
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); alert(L.ck_copied); }
    } catch (e) { /* the visitor cancelled, which is not an error */ }
  });

  document.addEventListener('langchange', () => {
    if (opened) {
      const c = C.todaysCookie(lang());
      fortuneEl.textContent = c.fortune;
      paintCard(c);
    }
  });

  if (C.openedToday()) reveal(true);
  paintStreak();
};
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
