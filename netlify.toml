# generated by scripts/build-deploy-zip.mjs
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/free"
  to = "/.netlify/functions/free-reading"
  status = 200
  force = true

[[redirects]]
  from = "/api/reading"
  to = "/.netlify/functions/reading"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/diag"
  to = "/.netlify/functions/diag"
  status = 200
  force = true

[[redirects]]
  from = "/galleta"
  to = "/galleta.html"
  status = 200

[[redirects]]
  from = "/horoscopo"
  to = "/horoscopo.html"
  status = 200

[[redirects]]
  from = "/consulta"
  to = "/consulta.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/aviso-legal"
  to = "/aviso-legal.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
