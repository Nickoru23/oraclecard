# generated by scripts/build-deploy-zip.mjs
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# What the host must not serve.
#
# publish = "." is the whole repository, so without these the site hands out its
# own server source at /netlify/functions/free-reading.mjs, its test suite at
# /scripts/, and its internal notes at /HANDOVER.md. None of that holds a
# secret, the keys are environment variables, but free-reading.mjs is a written
# description of the scheme that stops somebody taking unlimited free readings,
# which is not a thing to hand out.
#
# These sit above every other rule so they match first, and they are repeated
# under the two language prefixes because those rewrite to the bare path and a
# rewrite ends the chain.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

