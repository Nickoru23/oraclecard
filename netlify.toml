# generated by scripts/build-deploy-zip.mjs
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/free"
  to = "/.netlify/functions/free-reading"
  status = 200
  force = true

[[redirects]]
  from = "/api/reading"
  to = "/.netlify/functions/reading"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/diag"
  to = "/.netlify/functions/diag"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# The language lives in the address.
#
# /lectura.html is Spanish, /en/lectura.html is English, /de/lectura.html is
# German. All three serve the same file: which language it opens in is read
# from the path, so a link somebody shares opens in the language they were
# reading rather than in whatever the person opening it happened to choose last.
#
# These are rewrites, status 200, not redirects: the address stays as it is in
# the bar. They sit above the page rules below so that /en/fortuna resolves too.
# Assets are referenced from the root, so nothing under /css, /js or /api is
# reached through a prefix and none of this touches them.
[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/de"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/de/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/fortuna"
  to = "/fortuna.html"
  status = 200

# the fortune cookie became the daily fortune. Anything already linked or
# bookmarked under the old name keeps working.
[[redirects]]
  from = "/galleta"
  to = "/fortuna.html"
  status = 301

[[redirects]]
  from = "/galleta.html"
  to = "/fortuna.html"
  status = 301

[[redirects]]
  from = "/horoscopo"
  to = "/horoscopo.html"
  status = 200

[[redirects]]
  from = "/consulta"
  to = "/consulta.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

[[redirects]]
  from = "/aviso-legal"
  to = "/aviso-legal.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
