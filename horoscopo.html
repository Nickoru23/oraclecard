<style>
  .signs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
  .sign{border:1px solid var(--line);border-radius:var(--r);padding:18px 12px;text-align:center;
        background:transparent;color:inherit;font:inherit;cursor:pointer;transition:.18s}
  .sign:hover,.sign:focus-visible{border-color:var(--star);background:rgba(140,94,32,.10)}
  .sign .glyph{display:block;width:52px;margin:0 auto}
  .sign .glyph svg,.hd .glyph svg{width:100%;height:auto;display:block}
  .sign .nm{display:block;margin-top:6px;color:var(--bone);font-size:.95rem}
  .sign .rg{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
  .hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .hd .glyph{width:64px;flex:0 0 64px}
  .hd h2{margin:0;font-size:1.9rem}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:30px 0 10px}
  .slot{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--ink-2)}
  .slot .art{max-width:170px;margin:0 auto 14px;border-radius:var(--r-card)}
  .slot .art svg{width:100%;height:auto;display:block;border-radius:var(--r-card)}
  .slot h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--star);margin:0 0 6px}
  .slot .cn{color:var(--bone);margin:0 0 8px;font-size:1.05rem}
  .slot p{margin:0;font-size:.93rem;line-height:1.6;color:var(--muted)}
  .slot .lead{color:var(--bone);margin-bottom:8px}
  .sky{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:20px 0 0;
       max-width:520px;background:var(--ink-2)}
  .sky-h{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--star);margin:0 0 8px}
  .sky-l{margin:0;color:var(--bone);font-size:.95rem;line-height:1.6}
  /* the table: a label column that never moves, and a reading beside it */
  .eph{margin:0;display:grid;gap:0}
  /* 96px, not 88: the longest label in any of the three languages is German
     and it filled 88 to the pixel, so one different font stack would wrap it. */
  .eph-row{display:grid;grid-template-columns:96px 1fr;gap:0 16px;align-items:baseline;
           padding:9px 0;border-top:1px solid var(--line)}
  .eph-row:first-child{border-top:0;padding-top:2px}
  .eph dt{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--star);
          font-weight:600;margin:0}
  .eph dd{margin:0;color:var(--bone);font-size:1rem;line-height:1.45;
          font-variant-numeric:tabular-nums}
  .eph dd span{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
  @media(max-width:420px){.eph-row{grid-template-columns:1fr;gap:2px}}
  .sky-n{margin:9px 0 0;font-size:.78rem;color:var(--muted);line-height:1.5}
  .hor-sky{font-size:.97rem;line-height:1.7;color:var(--muted);margin:14px 0 0;max-width:62ch}
  .hor-open{font-size:1.05rem;line-height:1.7;color:var(--bone);margin:22px 0 0;max-width:62ch}
  .hor-close{font-size:.95rem;line-height:1.7;color:var(--muted);margin:22px 0 0;max-width:62ch;
             border-left:2px solid var(--star);padding-left:16px}
  .facts{display:flex;flex-wrap:wrap;gap:26px;margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line)}
  .fact{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fact b{display:block;margin-top:5px;font-size:1.15rem;letter-spacing:0;text-transform:none;color:var(--bone);font-weight:400}
  .swatch{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:7px;vertical-align:-1px;
          border:1px solid rgba(38,32,24,.35)}
  .kwrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .kwrow span{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.8rem;color:var(--bone)}
  @media(max-width:860px){.slots{grid-template-columns:1fr;gap:16px}
    .slot{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
    .slot .art{max-width:110px;margin:0}
    .slot .txt{min-width:0}}
  @media(max-width:600px){.signs{grid-template-columns:repeat(3,1fr);gap:10px}}
  @media(max-width:380px){.signs{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
window.initHoroscope = function () {
  const H = window.HOROSCOPE, T = window.T;
  const lang = () => window.getLang();
  const list = document.getElementById('hor-list');
  const one  = document.getElementById('hor-one');
  const grid = document.getElementById('signs');
  const dateEl = document.getElementById('hor-date');
  if (!grid) return;

  const s = () => T[lang()];
  const A = window.ASTRO;
  const YEAR = new Date().getFullYear();
  const short = m => s().months[m].slice(0, 3);
  const dm = d => `${d.getUTCDate()} ${short(d.getUTCMonth())}`;
  /* the dates the Sun actually enters and leaves each sign this year, computed
     rather than copied, which is why they shift by a day from year to year */
  const RANGES = {};
  H.SIGNS.forEach((sg, i) => {
    const r = A.signDates(i, YEAR);
    RANGES[sg.id] = r;
  });
  const range = sg => `${dm(RANGES[sg.id].start)} ${s().range_to} ${dm(RANGES[sg.id].end)}`;

  /* Each language writes a date its own way, down to the full stop after the
     day in German and the two "de" in Spanish. Handing the browser the region
     tag rather than the bare language is what gets those right, and it is also
     what keeps English on 23 September rather than September 23. */
  const LOCALE = { es: 'es-ES', en: 'en-GB', de: 'de-DE' };

  function paintDate() {
    const txt = new Date().toLocaleDateString(LOCALE[lang()] || lang(),
                  { day: 'numeric', month: 'long', year: 'numeric' });
    dateEl.textContent = s().hor_today.replace('{d}', txt);
  }

  /* The day's ephemeris: where the Sun and the Moon actually are, when each of
     them next moves on, and the two divisions of the Moon's path that the old
     almanacs kept. All of it computed here, none of it fetched. */
  function paintSky() {
    const L = s(), code = LOCALE[lang()] || lang();
    const e = A.ephemeris();

    const day = d => d.toLocaleDateString(code, { day: 'numeric', month: 'long' });
    const time = d => d.toLocaleTimeString(code, { hour: '2-digit', minute: '2-digit' });
    const arc = p => `${p.deg}° ${String(p.min).padStart(2, '0')}'`;
    /* The mansion number is an ordinal, and every language spells one its own
       way. English is the one that needs the ending picked per number, so it
       comes from the browser's own plural rules rather than a suffix glued to
       the string, which is how "1th" and "2th" used to get printed. */
    const ord = n => {
      if (lang() === 'es') return n + '.\u00AA';
      if (lang() === 'de') return n + '.';
      const tag = { one: 'st', two: 'nd', few: 'rd', other: 'th' };
      try { return n + tag[new Intl.PluralRules('en', { type: 'ordinal' }).select(n)]; }
      catch (e) { return String(n); }
    };
    /* "today" and "tomorrow" read better than a date two hours away */
    const when = d => {
      const now = new Date(), t = new Date(now); t.setDate(t.getDate() + 1);
      if (d.toDateString() === now.toDateString()) return L.eph_today;
      if (d.toDateString() === t.toDateString()) return L.eph_tomorrow;
      return day(d);
    };
    const row = (label, value, ...under) =>
      `<div class="eph-row"><dt>${label}</dt><dd>${value}` +
      under.filter(Boolean).map(u => `<span>${u}</span>`).join('') + '</dd></div>';

    const moonMoves = e.moon.leaves
      ? L.eph_moon_enters
          .replace('{s}', L[A.SIGN_IDS[e.moon.leaves.into]])
          .replace('{d}', when(e.moon.leaves.at))
          .replace('{t}', time(e.moon.leaves.at))
      : '';

    document.getElementById('sky').innerHTML =
      `<p class="sky-h">${L.sky_h}</p>
       <dl class="eph">
         ${row(L.eph_sun, `${L[e.sun.id]} ${arc(e.sun)}`,
               L.eph_enters.replace('{s}', L[e.sun.enters.sign]).replace('{d}', day(e.sun.enters.at)))}
         ${row(L.eph_moon, `${L[e.moon.id]} ${arc(e.moon)}`, moonMoves)}
         ${row(L.eph_phase,
               `${L['ph_' + e.phase.phase]}, ${L.eph_lit.replace('{pct}', Math.round(e.phase.illumination * 100))}`,
               e.newMoon ? L.eph_new.replace('{d}', day(e.newMoon)) : '',
               e.fullMoon ? L.eph_full.replace('{d}', day(e.fullMoon)) : '')}
         ${row(L.eph_mansion,
               L.eph_mansion_v.replace('{n}', ord(e.mansion.number)).replace('{name}', e.mansion.name))}
         ${row(L.eph_ruler, L['pl_' + e.ruler])}
       </dl>
       <p class="sky-n">${L.eph_note}</p>`;
    return A.sky();
  }

  function paintGrid() {
    grid.innerHTML = H.SIGNS.map(sg => `
      <button type="button" class="sign" data-sign="${sg.id}">
        <span class="glyph">${window.signSVG(sg.id, { label: s()[sg.id] })}</span>
        <span class="nm">${s()[sg.id]}</span>
        <span class="rg">${range(sg)}</span>
      </button>`).join('');
  }

  function paintSign(id) {
    const sg = H.SIGNS.find(x => x.id === id);
    if (!sg) return show(null);
    const r = H.forSign(sg.id);
    const L = s();
    const k = A.sky();
    const label = { love: L.hor_love, work: L.hor_work, day: L.hor_day };
    one.innerHTML = `
      <p style="margin:30px 0 0"><button type="button" class="btn btn-ghost" id="hor-back">${L.hor_back}</button></p>
      <div class="hd" style="margin-top:26px">
        <span class="glyph">${window.signSVG(sg.id, { label: L[sg.id] })}</span>
        <div><h2>${L[sg.id]}</h2><p class="small muted" style="margin:2px 0 0">${range(sg)}</p></div>
      </div>
      <p class="hor-open">${H.frame(lang(), 'open', r.open, {
        sign: L[sg.id], trait: H.trait(lang(), sg.id), card: r.cards[2].card.name[lang()],
      })}</p>
      <p class="hor-sky">${
        k.sun.id === sg.id ? L.season_yes : L.season_no.replace('{s}', L[k.sun.id])
      } ${L['moon_' + k.phase.phase]}</p>
      <div class="slots">
        ${r.cards.map(({ slot, card, v }) => `
          <div class="slot">
            <div class="art" data-turn>${window.cardObject(card, lang(), 'sm')}</div>
            <div class="txt">
              <h3>${label[slot]}</h3>
              <p class="cn">${card.name[lang()]}</p>
              <p class="lead">${H.frame(lang(), slot, v, { card: card.name[lang()] })}</p>
              <p>${H.slotText(slot, card, lang())}</p>
            </div>
          </div>`).join('')}
      </div>
      <p class="hor-close">${H.frame(lang(), 'close', r.close)}</p>
      <div class="facts">
        <div class="fact">${L.hor_kw}
          <div class="kwrow">${r.cards[2].card.kw[lang()].slice(0, 3).map(k => `<span>${k}</span>`).join('')}</div>
        </div>
        <div class="fact">${L.hor_number}<b>${r.number}</b></div>
        <div class="fact">${L.hor_colour}
          <b><span class="swatch" style="background:${r.colour.hex}"></span>${L[r.colour.k]}</b></div>
      </div>`;
    one.querySelector('#hor-back').addEventListener('click', () => {
      location.hash = '';
      show(null);
    });
    if (window.Ritual) window.Ritual.mark('card');
  }

  function show(id) {
    if (id) { paintSign(id); one.hidden = false; list.hidden = true; }
    else { one.hidden = true; one.innerHTML = ''; list.hidden = false; }
  }

  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    show(H.SIGNS.some(x => x.id === id) ? id : null);
  }

  grid.addEventListener('click', e => {
    const b = e.target.closest('.sign'); if (!b) return;
    location.hash = b.dataset.sign;
  });
  window.addEventListener('hashchange', fromHash);
  document.addEventListener('langchange', () => { paintDate(); paintSky(); paintGrid(); fromHash(); });

  paintDate(); paintSky(); paintGrid(); fromHash();
};
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
